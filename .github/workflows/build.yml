name: "Build Sub-GHz Editor (ufbt)"

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ufbt-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dev channel
            sdk-channel: dev
          - name: release channel
            sdk-channel: release
    name: 'ufbt: Build for ${{ matrix.name }}'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with ufbt
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        id: build-app
        with:
          sdk-channel: ${{ matrix.sdk-channel }}

      - name: Upload .fap artifact
        uses: actions/upload-artifact@v4
        with:
          name: subghz_editor-${{ matrix.sdk-channel }}-${{ steps.build-app.outputs.suffix }}
          path: ${{ steps.build-app.outputs.fap-artifacts }}

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && matrix.sdk-channel == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build-app.outputs.fap-artifacts }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
